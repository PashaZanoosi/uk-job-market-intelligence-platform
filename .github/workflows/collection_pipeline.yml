name: Daily Adzuna Collection

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}" >> .env
          echo "ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}" >> .env

      - name: Export Google Secrets
        run: |
          echo 'GOOGLE_CLIENT_SECRET<<EOF' >> $GITHUB_ENV
          echo '${{ secrets.GOOGLE_CLIENT_SECRET }}' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

          echo 'GOOGLE_TOKEN_PICKLE<<EOF' >> $GITHUB_ENV
          echo '${{ secrets.GOOGLE_TOKEN_PICKLE }}' >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Run Collection
        run: |
          python run_collection_pipeline.py